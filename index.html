<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Surprise!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        #question-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            color: #ff4d4d;
            font-size: 2.5em;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        .btn {
            padding: 15px 30px;
            font-size: 1.5em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            margin: 10px;
        }
        #yes-btn {
            background-color: #ff4d4d;
            box-shadow: 0 4px 10px rgba(255, 77, 77, 0.4);
        }
        #yes-btn:hover {
            background-color: #ff1a1a;
            transform: scale(1.1);
        }
        #no-btn {
            background-color: #cccccc;
            position: absolute;
        }
        #gifts-container {
            display: none;
            animation: fadeIn 1s ease-in;
            padding: 20px;
        }
        .gift-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 20px;
            max-width: 300px;
            display: inline-block;
            vertical-align: top;
        }
        .gift-card img {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .yt-btn {
            background-color: #ff0000;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 15px;
            font-weight: bold;
            transition: 0.3s;
        }
        .yt-btn:hover {
            background-color: #cc0000;
            box-shadow: 0 4px 10px rgba(204, 0, 0, 0.4);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Question Section -->
    <div id="question-container">
        <h1>Do you love me, Linaya? ❤️</h1>
        <div>
            <button id="yes-btn" class="btn" onclick="showGifts()">Yes!</button>
            <button id="no-btn" class="btn" onmouseover="moveNo()">No</button>
        </div>
    </div>

    <!-- Gifts Section -->
    <div id="gifts-container">
        <h1>Yay! I knew it! 🥰 Here are your gifts...</h1>
        
        <div class="gift-card">
            <h2>Gift 1 🎁</h2>
            <p>A beautiful memory for you!</p>
            <!-- මෙතන photo.jpg කියන්නේ ඔයා GitHub එකට අප්ලෝඩ් කරන ෆොටෝ එකේ නමයි -->
            <img src="photo.jpg" alt="Special Photo">
        </div>

        <div class="gift-card">
            <h2>Gift 2 🎵</h2>
            <p>A special song just for you!</p>
            <!-- ඔයා එවපු YouTube සින්දුව -->
            <a href="https://youtu.be/50bEC97eNp0" target="_blank" class="yt-btn">
                ▶️ Play Our Song
            </a>
        </div>
    </div>

    <script>
        function moveNo() {
            const noBtn = document.getElementById("no-btn");
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 60);
            noBtn.style.left = `${Math.max(0, x)}px`;
            noBtn.style.top = `${Math.max(0, y)}px`;
        }

        function showGifts() {
            document.getElementById("question-container").style.display = "none";
            document.getElementById("gifts-container").style.display = "block";
        }
    </script>

</body>
</html>
