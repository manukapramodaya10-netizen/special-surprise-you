<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Surprise</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fce4ec; /* ලස්සන ලා රෝස පාට පසුබිමක් */
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* බොත්තම එළියට යන එක නවත්වන්න */
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); /* ලස්සන ත්‍රිමාණ පෙනුමක් */
            z-index: 10;
        }
        img {
            width: 200px;
            height: 200px;
            border-radius: 50%; /* පින්තූරය රවුම් කරන්න */
            object-fit: cover;
            border: 5px solid #ff4081;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff4081;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }
        button {
            font-size: 18px;
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        #yesBtn {
            background-color: #4CAF50; /* කොළ පාට Yes බොත්තම */
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #yesBtn:hover {
            background-color: #45a049;
        }
        #noBtn {
            background-color: #f44336; /* රතු පාට No බොත්තම */
            color: white;
            position: absolute;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ඔයාගේ ෆොටෝ එකේ නම photo.jpg නිසා ඒක එහෙම්මම තිබ්බා -->
        <img src="photo.jpg" alt="Special Photo">
        <h1>Do you love me? ❤️</h1>
        
        <div class="buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        // No බොත්තම මූසිකය ළං කරනකොටම පැනලා යන කෝඩ් එක
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 50);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${Math.abs(x)}px`;
            noBtn.style.top = `${Math.abs(y)}px`;
        });

        // Yes එබුවාම YouTube වීඩියෝ එකට යන කෝඩ් එක
        yesBtn.addEventListener('click', () => {
            // ඔයාට ඕනේ කරන YouTube ලින්ක් එක මේ පහළින් දාන්න
            window.location.href = 'https://youtu.be/dQw4w9WgXcQ'; 
        });

        // ෆෝන් එකෙන් බලනකොට ටච් කළත් බොත්තම පැනලා යන්න
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 50);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${Math.abs(x)}px`;
            noBtn.style.top = `${Math.abs(y)}px`;
        });
    </script>

</body>
</html>
